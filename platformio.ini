; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32cam]
; pioarduino 53.03.10 - uses arduino-esp32 v3.1.0 + ESP-IDF v5.3 (locally installed, no download needed)
;platform = https://github.com/platformio/platform-espressif32.git#v6.6.0
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.10/platform-espressif32.zip
board = esp32cam
framework = arduino
extra_scripts = pre:version_build.py
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
board_build.arduino.upstream_packages = no
board_build.partitions = min_spiffs.csv
lib_deps = witnessmenow/UniversalTelegramBot@^1.3.0

[env:esp32cam_ota]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.10/platform-espressif32.zip
board = esp32cam
framework = arduino
extra_scripts = pre:version_build.py
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
board_build.arduino.upstream_packages = no
board_build.partitions = min_spiffs.csv
lib_deps = witnessmenow/UniversalTelegramBot@^1.3.0
upload_protocol = espota
upload_port = 192.168.1.196
upload_flags = --host_ip=192.168.1.131

