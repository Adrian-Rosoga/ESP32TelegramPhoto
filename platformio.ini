; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
board_build.arduino.upstream_packages = no
board_build.partitions = min_spiffs.csv
lib_deps = witnessmenow/UniversalTelegramBot@^1.3.0

; ---------------------------------------------------------------------------
; Example OTA upload environment
; Usage: replace `upload_port` with your device IP or mDNS hostname
; (the device prints hostname/IP in Serial Monitor, e.g. esp32cam-XXXXXX)
; If you use a password, set it with `upload_flags = --auth=YOUR_PASSWORD`
; ---------------------------------------------------------------------------
[env:esp32cam_ota]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
board_build.arduino.upstream_packages = no
board_build.partitions = min_spiffs.csv
lib_deps = witnessmenow/UniversalTelegramBot@^1.3.0
upload_protocol = espota
; Replace the IP or hostname below with your device address
; Set this to your device IP or mDNS name (updated to your device IP)

;;;
;;; ESP #1 - Water Softener
;;;
;upload_port = 192.168.1.117
; upload_port = esp32cam-F75338.local

;;;
;;; ESP #2 - Boiler
;;;
upload_port = 192.168.1.196
;upload_port = esp32cam-F5A62C.local

; Pass the PC host IP to espota so the device can connect back to the uploader
upload_flags = --host_ip=192.168.1.131

; Example for password-protected OTA (uncomment and set your password):
; upload_flags = --auth=your_ota_password
; Example combining auth and host IP:
; upload_flags = --auth=your_ota_password --host_ip=192.168.1.131
